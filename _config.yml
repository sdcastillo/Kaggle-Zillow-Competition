# SamWiki theme contract for this project site.
# Theme setup follows GitHub's Jekyll theme guide:
# https://docs.github.com/en/pages/setting-up-a-github-pages-site-with-jekyll/adding-a-theme-to-your-github-pages-site-using-jekyll
#
# Skin copied from sdcastillo/sdcastillo.github.io main:
#   assets/css/style.scss       @import "jekyll-theme-cayman"; then SamWiki tokens
#   _layouts/default.html
#   _includes/head-custom.html
#   _includes/samwiki-nav.html
# The main page sets `samwiki: true` in front matter.
#
# Publish from the default branch (`master`) at the repository root.
# Live URL once Pages is enabled: https://sdcastillo.github.io/Kaggle-Zillow-Competition/

title: Zillow Prize
description: A gradient boosted machine for Zillow's log error between the Zestimate and the sale price.
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme
show_downloads: false
markdown: kramdown

# The R Markdown source opens with YAML front matter. Leave it out of the
# Jekyll build so it is not published as a second page. The knitted notebook
# stays in the repository as a static HTML file.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - zillow_gbm.Rmd
